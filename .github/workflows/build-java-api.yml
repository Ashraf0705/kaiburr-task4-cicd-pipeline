# Name of the workflow
name: Build and Deploy Kaiburr Java API

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the Task 1 repository into a predictable directory.
      - name: Checkout Java API Source Code
        uses: actions/checkout@v4
        with:
          repository: 'Ashraf0705/kaiburr-task1-java-api'
          ref: 'main'
          path: 'source-code' # Checkout to a folder named 'source-code'

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build with Maven inside the checked-out directory
      - name: Build with Maven
        working-directory: ./source-code
        run: mvn -B package --file pom.xml -DskipTests

      # Step 4: Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and push Docker image
      # CRITICAL: We explicitly tell the action that the build context
      # (where the Dockerfile is) is the 'source-code' directory.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./source-code
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kaiburr-task-api:${{ github.event.inputs.version }}
